name: Publish Release
on:
  push:
    branches: [main]
    paths: ['.release/request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fn-dit-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned official fnpack
        run: |
          curl --fail --location --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.3.3-linux-amd64 -o "$RUNNER_TEMP/fnpack"
          echo "1464d6aa9b995ebecb263c5ec60f0f4a7cbf45e0ce887836755fd65abd647d1e  $RUNNER_TEMP/fnpack" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/fnpack"
      - name: Build manual-install distribution and run regression tests
        env:
          FPK_UNSIGNED: '1'
        run: FNPACK="$RUNNER_TEMP/fnpack" bash scripts/build-fpk.sh
      - name: Validate the actual distribution package
        run: |
          python3 tests/fpk_test.py dist/fn-dit-0.1.6-unsigned.fpk
          python3 tests/lifecycle-smoke.py dist/fn-dit-0.1.6-unsigned.fpk
          python3 scripts/publish-release.py --dry-run
      - name: Upload assets to a draft, verify digests, then publish latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fn-dit-0.1.6-release-evidence
          path: dist/*
          if-no-files-found: warn
          retention-days: 30
