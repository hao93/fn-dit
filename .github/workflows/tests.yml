name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check app/server.js
          node --check app/lib/discovery.js
          node --check app/lib/importer.js
          node --check app/lib/stability.js
          node --check app/lib/time.js
          node --check app/lib/history.js
          node --check app/lib/schedule.js
          node --check app/lib/metadata.js
          node --check app/ui/app.js
          node --check app/ui/directory-picker.mjs
          node --check app/ui/folder-callback.mjs
  fpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official fnpack 1.3.3 and verify pinned hash
        run: |
          curl --fail --location --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.3.3-linux-amd64 -o "$RUNNER_TEMP/fnpack"
          echo "1464d6aa9b995ebecb263c5ec60f0f4a7cbf45e0ce887836755fd65abd647d1e  $RUNNER_TEMP/fnpack" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/fnpack"
          "$RUNNER_TEMP/fnpack" --help
      - name: Build unsigned local-test FPK with official fnpack
        env:
          FPK_DEBUG_UNSIGNED: '1'
        run: FNPACK="$RUNNER_TEMP/fnpack" bash scripts/build-fpk.sh
      - name: Reject corrupt packages and smoke test packaged service
        run: |
          python3 tests/fpk_test.py dist/fn-dit-0.1.6-unsigned-test.fpk
          python3 tests/lifecycle-smoke.py dist/fn-dit-0.1.6-unsigned-test.fpk
      - name: Upload local-test package and audit (not a signed release)
        uses: actions/upload-artifact@v4
        with:
          name: fn-dit-0.1.6-unsigned-test
          path: dist/*
          if-no-files-found: error
          retention-days: 30
